[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apartment-hunter"
version = "0.1.0"
description = "Costa Rica apartment scraper: collect, normalize, dedupe, classify with Jev, score, notify."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "supabase>=2.5",
  "typesafe-sdk>=0.7",
  "pillow>=10.0",
]

[project.optional-dependencies]
js = ["playwright>=1.45"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
hunter = "hunter.cli:main"

[tool.setuptools.packages.find]
include = ["hunter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
